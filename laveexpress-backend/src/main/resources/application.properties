# Arquivo: laveexpress-backend/src/main/resources/application.properties
# Configurações padrão - usadas quando não há profile específico

# ==========================================
# CONFIGURAÇÃO DO BANCO DE DADOS
# ==========================================

# Em produção: DATABASE_URL será fornecida pelo Render
# Em desenvolvimento: usa configuração local
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:cabideverde10}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURAÇÃO JPA/HIBERNATE
# ==========================================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

# ==========================================
# CONFIGURAÇÃO DO SERVIDOR
# ==========================================

# Render usa PORT, desenvolvimento usa 1000
server.port=${PORT:1000}

# ==========================================
# CONFIGURAÇÃO JWT
# ==========================================

jwt.secret=${JWT_SECRET:LavExpressTCC2024JwtSecretKeyAutenticacaoSistemaAgendamentoLavajatoSeguroComMaisDe64Caracteres}
jwt.expiration=${JWT_EXPIRATION:864000000}

# ==========================================
# CONFIGURAÇÃO DE PROFILES
# ==========================================

# Profile padrão (dev local), em produção será 'prod'
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# ==========================================
# CONFIGURAÇÕES DE LOGGING
# ==========================================

logging.level.com.lavexpress=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
logging.level.org.hibernate=${HIBERNATE_LOG_LEVEL:WARN}